 var lista = prompt("Introduce las 3 notas separados por puntos y comas.");
 var valores=[];
valores=lista.split(`;`);

    suma = suma + Number(valores[i]);
}

    console.log("Suspenso");
} else if(notamedia >= 5 && notamedia <= 10){
